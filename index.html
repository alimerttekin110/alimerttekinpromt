<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ali Mert Tekin — Prompt Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ══════════════════════════════════════════
     DESIGN TOKENS — Dark (default)
     ══════════════════════════════════════════ */
  :root {
    --bg: #0F1115;
    --surface: #181B22;
    --surface2: #1E222B;
    --border: #2A2F3A;
    --primary: #6C63FF;
    --secondary: #8B5CF6;
    --grad: linear-gradient(135deg, #6C63FF 0%, #8B5CF6 100%);
    --text: #F8F8F8;
    --muted: #9CA3AF;
    --glow: rgba(108, 99, 255, 0.22);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.25);
    --shadow-md: 0 12px 28px rgba(0,0,0,0.35);
  }

  /* ══════════════════════════════════════════
     DESIGN TOKENS — Light
     ══════════════════════════════════════════ */
  html.light {
    --bg: #F7F7FA;
    --surface: #FFFFFF;
    --surface2: #F2F2F6;
    --border: #E5E5EC;
    --primary: #6C63FF;
    --secondary: #8B5CF6;
    --grad: linear-gradient(135deg, #6C63FF 0%, #8B5CF6 100%);
    --text: #15161B;
    --muted: #6B7280;
    --glow: rgba(108, 99, 255, 0.14);
    --shadow-sm: 0 2px 10px rgba(20,20,30,0.06);
    --shadow-md: 0 16px 32px rgba(20,20,30,0.10);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--primary); color: #fff; }

  a { color: inherit; }

  /* ── HEADER ── */
  .site-header {
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background 0.3s, border-color 0.3s;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
  }

  .logo-badge i { color: var(--primary); font-size: 15px; }

  .logo-badge span {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .header-count {
    font-size: 12.5px;
    color: var(--muted);
  }

  .header-count b { color: var(--primary); font-weight: 600; }

  /* ── THEME TOGGLE ── */
  .theme-toggle {
    width: 40px;
    height: 23px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: border-color 0.2s;
    flex-shrink: 0;
  }

  .theme-toggle:hover { border-color: var(--primary); }

  .toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--grad);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    transition: transform 0.25s ease;
  }

  html.light .toggle-knob { transform: translateX(17px); }

  /* ── HERO (compact) ── */
  .hero {
    text-align: center;
    padding: 40px 24px 26px;
    max-width: 720px;
    margin: 0 auto;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--primary);
    margin-bottom: 16px;
  }

  .eyebrow .amt-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: dotBlink 1.6s ease-in-out infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  .eyebrow .amt-text { animation: textBlink 2.8s ease-in-out infinite; }

  @keyframes textBlink {
    0%, 92%, 100% { opacity: 1; }
    95% { opacity: 0.3; }
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 4.2vw, 38px);
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .hero h1 .hero-sub {
    display: block;
    font-size: clamp(15px, 2.2vw, 19px);
    font-weight: 600;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-top: 6px;
    letter-spacing: 0.01em;
  }

  .hero p.lede {
    font-size: 14px;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto 22px;
    line-height: 1.6;
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    max-width: 460px;
    margin: 0 auto;
  }

  .search-wrap input {
    width: 100%;
    padding: 14px 18px 14px 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .search-wrap input::placeholder { color: var(--muted); }

  .search-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--glow);
  }

  .search-wrap .s-ico {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 17px;
    pointer-events: none;
  }

  /* ── STATS ROW (decorative, under hero) ── */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 680px;
    margin: 26px auto 0;
    padding: 0 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .stat-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: var(--shadow-sm); }

  .stat-card b {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }

  .stat-card span {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* ── FOLLOW STRIP (outside hero) ── */
  .follow-strip {
    display: flex;
    justify-content: center;
    padding: 22px 24px 6px;
  }

  .follow-banner {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 9px 18px;
    font-size: 12.5px;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }

  .follow-banner:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }

  .follow-banner a {
    background: linear-gradient(135deg, #FEDA75 0%, #FA7E1E 25%, #D62976 50%, #962FBF 75%, #4F5BD5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    text-decoration: none;
    margin-left: 2px;
    transition: filter 0.2s;
  }

  .follow-banner a:hover { filter: brightness(1.15); text-decoration: underline; text-decoration-color: #D62976; }

  .follow-banner i { color: #E1306C; font-size: 15px; }

  /* ── FILTERS (pills) ── */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 18px 24px 8px;
  }

  .fb {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Inter', sans-serif;
  }

  .fb:hover { border-color: var(--primary); color: var(--text); transform: translateY(-1px); }

  .fb.active {
    border-color: transparent;
    background: var(--grad);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }

  /* ── SUB FILTERS (Gizli Kodlar alt kategorileri) ── */
  .subfilters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 4px 24px 8px;
    max-width: 900px;
    margin: 0 auto;
  }

  .sf {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .sf:hover { border-color: var(--primary); color: var(--text); }
  .sf.active { background: var(--primary); border-color: transparent; color: #fff; }

  /* ── HOW TO USE BOX ── */
  .howto { max-width: 720px; margin: 10px auto 0; padding: 0 24px; }

  .howto-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.75;
  }

  .howto-box h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .howto-box code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--primary);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 6px;
  }

  .howto-box ul { margin: 8px 0 8px 18px; }

  /* ── POPULAR ── */
  .popular-section {
    max-width: 1060px;
    margin: 8px auto 0;
    padding: 20px 24px 0;
  }

  .popular-head { text-align: center; margin-bottom: 18px; }

  .popular-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .popular-head p { font-size: 12.5px; color: var(--muted); }

  .popular-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }

  .popular-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
